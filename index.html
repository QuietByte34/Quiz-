<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wissenskartei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --bg: #14171f;
    --panel: #1c2029;
    --panel-line: #2a2f3d;
    --ink-muted: #8b92a6;
    --ink-light: #e7e5df;
    --card: #ece2c9;
    --card-shadow1: #d9cdac;
    --card-shadow2: #c6b98f;
    --ink-on-card: #2b2417;
    --ink-on-card-muted: #6b5f45;
    --brass: #c09a4e;
    --good: #6b8f71;
    --bad: #b15c4a;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    background-image:radial-gradient(circle at 15% 0%,#1a1e29 0%,var(--bg) 55%);
    color:var(--ink-light);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
  }

  .shell{max-width:640px;margin:0 auto;padding:28px 20px 60px;}

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:10px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0;
    letter-spacing:.2px;
  }

  h1 span{
    color:var(--brass);
    font-style:italic;
    font-weight:500;
  }

  nav{
    display:flex;
    gap:2px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:8px;
    padding:3px;
  }

  nav button{
    background:transparent;
    border:none;
    color:var(--ink-muted);
    font-family:'IBM Plex Sans';
    font-size:.85rem;
    font-weight:500;
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
  }

  nav button.active{
    background:var(--panel-line);
    color:var(--ink-light);
  }

  .stat-line{
    font-size:.82rem;
    color:var(--ink-muted);
    margin-bottom:22px;
  }

  .stat-line b{
    color:var(--brass);
    font-weight:600;
  }

  .add-box{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:16px;
    margin-bottom:22px;
  }

  .add-box h2{
    font-family:'Fraunces';
    font-weight:500;
    font-size:1.05rem;
    margin:0 0 12px;
  }

  .add-tabs{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }

  .add-tabs button{
    flex:1;
    background:var(--bg);
    border:1px solid var(--panel-line);
    color:var(--ink-muted);
    padding:8px;
    border-radius:7px;
    font-size:.8rem;
    cursor:pointer;
  }

  .add-tabs button.active{
    border-color:var(--brass);
    color:var(--ink-light);
  }

  input[type=text],
  input[type=password],
  textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--panel-line);
    border-radius:7px;
    color:var(--ink-light);
    padding:9px 11px;
    font-family:'IBM Plex Sans';
    font-size:.9rem;
    resize:vertical;
  }

  textarea{min-height:90px;}

  label.field{
    display:block;
    font-size:.75rem;
    color:var(--ink-muted);
    margin:10px 0 5px;
  }

  .row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:12px;
    flex-wrap:wrap;
  }

  .btn{
    background:var(--brass);
    color:#1c1608;
    border:none;
    border-radius:7px;
    padding:9px 16px;
    font-weight:600;
    cursor:pointer;
  }

  .btn:disabled{
    opacity:.45;
    cursor:default;
  }

  .btn.mic{
    background:var(--panel-line);
    color:var(--ink-light);
    border-radius:50%;
    width:38px;
    height:38px;
    padding:0;
  }

  .btn.mic.recording{background:var(--bad);}

  .secondary{background:var(--panel-line);color:var(--ink-light);}
  .topic-filter{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px;}
  .topic-chip{background:var(--bg);border:1px solid var(--panel-line);color:var(--ink-muted);padding:7px 10px;border-radius:999px;font-size:.76rem;cursor:pointer;}
  .topic-chip.active{border-color:var(--brass);color:var(--ink-light);}
  .progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px;}
  .progress-box{background:var(--panel);border:1px solid var(--panel-line);border-radius:9px;padding:11px;text-align:center;font-size:.72rem;color:var(--ink-muted);}
  .progress-box b{display:block;color:var(--ink-light);font-size:1.15rem;margin-bottom:2px;}
  .feedback-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-on-card-muted);margin-top:10px;margin-bottom:2px;}
  .error-card{background:var(--panel);border:1px solid var(--panel-line);border-radius:9px;padding:12px 14px;margin-bottom:9px;}

  .hint{
    font-size:.75rem;
    color:var(--ink-muted);
    margin-top:6px;
  }

  .source-card{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:9px;
    padding:12px 14px;
    margin-bottom:9px;
    display:flex;
    justify-content:space-between;
    gap:10px;
  }

  .source-card .meta{
    font-family:'Fraunces';
    font-size:.98rem;
  }

  .source-card .snippet{
    font-size:.78rem;
    color:var(--ink-muted);
    margin-top:3px;
    line-height:1.4;
  }

  .source-card button{
    background:none;
    border:none;
    color:var(--ink-muted);
    cursor:pointer;
  }

  .empty{
    color:var(--ink-muted);
    font-size:.88rem;
    padding:20px 4px;
    text-align:center;
  }

  .quiz-wrap{
    display:flex;
    justify-content:center;
    padding-top:10px;
  }

  .card-stack{
    position:relative;
    width:100%;
    max-width:420px;
  }

  .card-stack::before,
  .card-stack::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:4px;
  }

  .card-stack::before{
    background:var(--card-shadow1);
    transform:rotate(-2.2deg) translateY(3px);
  }

  .card-stack::after{
    background:var(--card-shadow2);
    transform:rotate(2.4deg) translateY(5px);
  }

  .index-card{
    position:relative;
    z-index:1;
    background:var(--card);
    color:var(--ink-on-card);
    border-radius:4px;
    padding:26px 24px 22px;
    min-height:230px;
    box-shadow:0 14px 28px rgba(0,0,0,.35);
  }

  .index-card .tab{
    position:absolute;
    top:-14px;
    left:24px;
    background:var(--card);
    padding:4px 12px 3px;
    border-radius:4px 4px 0 0;
    font-size:.68rem;
  }

  .index-card .topic{
    font-size:.72rem;
    color:var(--ink-on-card-muted);
    margin-bottom:10px;
  }

  .index-card .question{
    font-family:'Fraunces';
    font-size:1.28rem;
    line-height:1.4;
    margin-bottom:18px;
  }

  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:8px;
    font-size:.88rem;
    line-height:1.5;
  }

  .feedback.correct{
    background:rgba(107,143,113,.15);
    border:1px solid var(--good);
  }

  .feedback.wrong{
    background:rgba(177,92,74,.15);
    border:1px solid var(--bad);
  }

  .feedback.partial{
    background:rgba(192,154,78,.15);
    border:1px solid var(--brass);
  }

  .center-block{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-muted);
  }

  .loading{
    display:inline-block;
    width:14px;
    height:14px;
    border:2px solid rgba(255,255,255,.25);
    border-top-color:var(--brass);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }

  @keyframes spin{
    to{transform:rotate(360deg);}
  }
</style>
</head>

<body>

<div class="shell" id="app"></div>

<script>

/* HIER IST DIE KORREKTUR */
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const state = {
  view:'library',
  addMode:'text',
  sources:[],
  history:[],
  currentQuestion:null,
  feedback:null,
  loadingQuestion:false,
  loadingGrading:false,
  loadingPdf:false,
  recording:false,
  recognitionTarget:null,
  draftTitle:'',
  draftText:'',
  answerText:'',
  recentlyAskedIds:[],
  selectedTopics:[],
  errorOnly:false,
  followupOpen:false,
  followupText:'',
  followupMessages:[],
  loadingFollowup:false,
  settingsView:false,
  settings:{
    provider:'anthropic',
    anthropicKey:'',
    deepseekKey:'',
    deepseekProxyUrl:''
  }
};

function loadSettings(){
  try{
    const raw=localStorage.getItem('wissenskartei_settings');
    if(raw) state.settings={...state.settings,...JSON.parse(raw)};
  }catch(e){}
}

function saveSettings(){
  try{
    localStorage.setItem(
      'wissenskartei_settings',
      JSON.stringify(state.settings)
    );
  }catch(e){}
}

function loadStorage(){
  try{
    const s=localStorage.getItem('wissenskartei_sources');
    if(s) state.sources=JSON.parse(s);
  }catch(e){}

  try{
    const h=localStorage.getItem('wissenskartei_history');
    if(h) state.history=JSON.parse(h);
  }catch(e){}

  loadSettings();
  render();
}

function saveSources(){
  try{
    localStorage.setItem(
      'wissenskartei_sources',
      JSON.stringify(state.sources)
    );
  }catch(e){}
}

function saveHistory(){
  try{
    localStorage.setItem(
      'wissenskartei_history',
      JSON.stringify(state.history)
    );
  }catch(e){}
}

function importPreset() {
  const existing = new Set(state.sources.map(s => s.title));
  const toAdd = PRESET_WELTGESCHICHTE.filter(p => !existing.has(p.title));

  toAdd.forEach((p, i) => {
    state.sources.push({
      id: (Date.now() + i).toString(),
      title: p.title,
      text: p.text,
      addedAt: new Date().toISOString()
    });
  });

  saveSources();
  render();
}


/* SPRACHEINGABE */

let recognition = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SR) {
  recognition = new SR();
  recognition.lang = 'de-DE';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    let finalText = '';

    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalText += e.results[i][0].transcript + ' ';
      }
    }

    if (!finalText) return;

    if (state.recognitionTarget === 'draft') {
      state.draftText =
        (state.draftText ? state.draftText + ' ' : '') +
        finalText.trim();
    }

    else if (state.recognitionTarget === 'answer') {
      state.answerText =
        (state.answerText ? state.answerText + ' ' : '') +
        finalText.trim();
    }

    render();
  };

  recognition.onend = () => {
    state.recording = false;
    state.recognitionTarget = null;
    render();
  };
}


function toggleRecording(target) {

  if (!recognition) return;

  if (state.recording && state.recognitionTarget === target) {
    recognition.stop();
    return;
  }

  if (state.recording) recognition.stop();

  state.recognitionTarget = target;
  state.recording = true;

  render();

  try {
    recognition.start();
  }
  catch (e) {}
}


/* JSON AUS KI-ANTWORT HOLEN */

function extractJson(text) {

  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');

  if (start === -1 || end === -1 || end < start) {
    throw new Error(
      'Keine JSON-Antwort gefunden: ' +
      text.slice(0, 200)
    );
  }

  return JSON.parse(
    text.slice(start, end + 1)
  );
}


/* KI AUFRUF */

async function callClaude(prompt) {

  const provider = state.settings.provider;

  if (provider === 'anthropic') {

    if (!state.settings.anthropicKey) {
      throw new Error(
        'Bitte zuerst einen Anthropic-API-Key in den Einstellungen eintragen.'
      );
    }

    const response = await fetch(
      "https://api.anthropic.com/v1/messages",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-api-key": state.settings.anthropicKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },

        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 1000,

          messages: [
            {
              role: "user",
              content: prompt
            }
          ]
        })
      }
    );

    if (!response.ok) {

      const errText =
        await response.text().catch(() => '');

      throw new Error(
        'Anthropic-API-Fehler ' +
        response.status +
        ': ' +
        errText.slice(0, 200)
      );
    }

    const data = await response.json();

    const text =
      (data.content || [])
        .map(b => b.text || '')
        .join('\n');

    return extractJson(text);
  }


  else {

    if (!state.settings.deepseekKey) {
      throw new Error(
        'Bitte zuerst einen DeepSeek-API-Key in den Einstellungen eintragen.'
      );
    }

    const url =
      state.settings.deepseekProxyUrl.trim() ||
      "https://api.deepseek.com/chat/completions";

    const response = await fetch(
      url,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization":
            "Bearer " + state.settings.deepseekKey
        },

        body: JSON.stringify({
          model: "deepseek-chat",
          max_tokens: 1000,

          messages: [
            {
              role: "user",
              content: prompt
            }
          ]
        })
      }
    );

    if (!response.ok) {

      const errText =
        await response.text().catch(() => '');

      throw new Error(
        'DeepSeek-API-Fehler ' +
        response.status +
        ': ' +
        errText.slice(0, 200)
      );
    }

    const data = await response.json();

    const text =
      data.choices &&
      data.choices[0] &&
      data.choices[0].message
        ? data.choices[0].message.content
        : '';

    return extractJson(text);
  }
}


/* PDF EINLESEN */

async function addPdf(file) {

  if (typeof pdfjsLib === 'undefined') {

    alert(
      'Die PDF-Funktion konnte nicht geladen werden. ' +
      'Du kannst aber weiterhin Text direkt einfügen.'
    );

    return;
  }

  state.loadingPdf = true;
  render();

  try {

    const buf = await file.arrayBuffer();

    const pdf =
      await pdfjsLib
        .getDocument({data: buf})
        .promise;

    let text = '';

    for (let i = 1; i <= pdf.numPages; i++) {

      const page =
        await pdf.getPage(i);

      const content =
        await page.getTextContent();

      text +=
        content.items
          .map(it => it.str)
          .join(' ') +
        '\n';
    }

    state.draftText = text.trim();

    if (!state.draftTitle) {
      state.draftTitle =
        file.name.replace(/\.pdf$/i, '');
    }

  }

  catch (e) {

    alert(
      'PDF konnte nicht gelesen werden: ' +
      e.message
    );
  }

  state.loadingPdf = false;
  render();
}

/* LERNFORTSCHRITT UND THEMEN */
function sourceTopic(s){
  const first=(s.text||'').split('.')[0].trim();
  if(first && first.length < 35) return first;
  const t=(s.title||'').toLowerCase();
  if(/ägypt|menes|cheops|echnaton|tutanch|ramses/.test(t)) return 'Ägypten';
  if(/rom|cäsar|nero|augustus|punisch|hannibal|spartak|trajan|dioklet/.test(t)) return 'Römisches Reich';
  return 'Weitere';
}
function topics(){ return [...new Set(state.sources.map(sourceTopic))].sort((a,b)=>a.localeCompare(b,'de')); }
function latestVerdict(sourceId){
  for(let i=state.history.length-1;i>=0;i--) if(state.history[i].sourceId===sourceId) return state.history[i].verdict;
  return null;
}
function progressStats(){
  let learned=0, unsure=0, unseen=0;
  state.sources.forEach(s=>{ const v=latestVerdict(s.id); if(v==='richtig') learned++; else if(v==='teilweise'||v==='falsch') unsure++; else unseen++; });
  return {learned,unsure,unseen};
}
function weightedPick(pool){
  const weighted=[];
  pool.forEach(s=>{ const v=latestVerdict(s.id); const n=v==='falsch'?6:v==='teilweise'?4:v==='richtig'?1:3; for(let i=0;i<n;i++) weighted.push(s); });
  return weighted[Math.floor(Math.random()*weighted.length)];
}
function recordResult(verdict, answer){
  if(!state.currentQuestion) return;
  state.history.push({question:state.currentQuestion.question,answer:answer||'',verdict,sourceId:state.currentQuestion.sourceId,date:new Date().toISOString()});
  saveHistory();
}
function dontKnow(){
  if(!state.currentQuestion) return;
  const source=state.sources.find(s=>s.id===state.currentQuestion.sourceId);
  state.feedback={verdict:'falsch',feedback:'Kein Problem – diese Karte wird künftig häufiger wiederholt.',missing:'',correctAnswer:source?source.text:''};
  recordResult('falsch','Weiß ich nicht');
  render();
}


/* FRAGE ERZEUGEN */

async function generateQuestion() {

  if (state.sources.length === 0) return;

  state.loadingQuestion = true;
  state.currentQuestion = null;
  state.feedback = null;
  state.answerText = '';
  state.followupOpen = false;
  state.followupText = '';
  state.followupMessages = [];
  state.loadingFollowup = false;
  state.quizError = null;

  render();

  try {

    let basePool = state.sources.filter(s =>
      state.selectedTopics.length===0 || state.selectedTopics.includes(sourceTopic(s))
    );
    if(state.errorOnly) basePool=basePool.filter(s=>{const v=latestVerdict(s.id);return v==='falsch'||v==='teilweise';});
    if(basePool.length===0) throw new Error('Für diese Auswahl gibt es keine passenden Karten.');
    let pool=basePool.filter(s=>!state.recentlyAskedIds.includes(s.id));
    if(pool.length===0){ state.recentlyAskedIds=[]; pool=basePool; }
    const source=weightedPick(pool);

    const prompt =
`Du bist ein Geschichts-Quizmaster.

Hier ist eine einzelne Karteikarte aus der Sammlung des Nutzers:

Titel: ${source.title}
Inhalt: ${source.text}

Stelle EINE konkrete, offene Wissensfrage auf Deutsch genau zu diesem Inhalt.

Die Frage soll offen sein und der Nutzer soll in eigenen Worten antworten.

Antworte NUR mit einem JSON-Objekt:

{"question":"...","topic":"..."}`;

    const result =
      await callClaude(prompt);

    if (!result.question) {
      throw new Error(
        'Antwort enthielt keine Frage.'
      );
    }

    result.sourceId = source.id;

    state.currentQuestion = result;

    state.recentlyAskedIds.push(
      source.id
    );

    const keepLimit =
      Math.max(
        1,
        Math.floor(
          state.sources.length * 0.8
        )
      );

    if (
      state.recentlyAskedIds.length >
      keepLimit
    ) {
      state.recentlyAskedIds.shift();
    }

  }

  catch (e) {

    state.quizError = e.message;
  }

  state.loadingQuestion = false;
  render();
}


/* ANTWORT BEWERTEN */

async function submitAnswer() {

  if (
    !state.answerText.trim() ||
    !state.currentQuestion
  ) return;

  state.loadingGrading = true;
  state.quizError = null;

  render();

  try {

    const source =
      state.sources.find(
        s =>
          s.id ===
          state.currentQuestion.sourceId
      );

    const context =
      source
        ? `Titel: ${source.title}
Inhalt: ${source.text}`
        : '';

    const prompt =
`Du bist ein Geschichts-Quizmaster.

Karteikarte:
${context}

Frage:
${state.currentQuestion.question}

Antwort des Nutzers:
${state.answerText.trim()}

Bewerte die Antwort.

Antworte NUR als JSON:

{"verdict":"richtig","feedback":"Kurze Erklärung, was richtig war.","missing":"Was noch fehlte; leer lassen, wenn vollständig.","correctAnswer":"Kurze Musterantwort."}

Als verdict sind erlaubt:
"richtig", "teilweise" oder "falsch".`;

    const result =
      await callClaude(prompt);

    if (!result.verdict) {
      throw new Error(
        'Antwort enthielt keine Bewertung.'
      );
    }

    state.feedback = result;

    recordResult(result.verdict, state.answerText.trim());

  }

  catch (e) {

    state.quizError = e.message;
  }

  state.loadingGrading = false;
  render();
}



/* NACHFRAGEN ZUR AKTUELLEN KARTE */
function openFollowup(){
  state.followupOpen=true;
  render();
  setTimeout(()=>{const el=document.getElementById('followup-input');if(el) el.focus();},0);
}

async function askFollowup(){
  if(!state.followupText.trim() || !state.currentQuestion || state.loadingFollowup) return;
  const userQuestion=state.followupText.trim();
  const source=state.sources.find(s=>s.id===state.currentQuestion.sourceId);
  const prior=state.followupMessages.map(m=>(m.role==='user'?'Nutzer':'Tutor')+': '+m.text).join('\n');

  state.followupMessages.push({role:'user',text:userQuestion});
  state.followupText='';
  state.loadingFollowup=true;
  state.quizError=null;
  render();

  try{
    const prompt=`Du bist ein freundlicher Geschichts-Tutor. Der Nutzer lernt mit einer Karteikarte und möchte zu genau dieser Frage etwas nachfragen.

Karteikarte:
Titel: ${source ? source.title : ''}
Inhalt: ${source ? source.text : ''}

Ursprüngliche Quizfrage:
${state.currentQuestion.question}

Antwort des Nutzers:
${state.answerText || 'Weiß ich nicht'}

Bewertung:
${state.feedback ? state.feedback.verdict : ''}
Feedback:
${state.feedback ? state.feedback.feedback : ''}
Fehlender Punkt:
${state.feedback ? (state.feedback.missing || '') : ''}
Musterantwort:
${state.feedback ? (state.feedback.correctAnswer || '') : ''}

Bisherige Nachfragen:
${prior || 'Noch keine.'}

Neue Frage des Nutzers:
${userQuestion}

Beantworte die neue Frage verständlich auf Deutsch. Du darfst notwendiges historisches Hintergrundwissen ergänzen. Wenn du über den Inhalt der Karteikarte hinausgehst, mache das deutlich. Antworte knapp, aber so ausführlich wie nötig.

Antworte NUR als JSON:
{"answer":"..."}`;

    const result=await callClaude(prompt);
    if(!result.answer) throw new Error('Antwort enthielt keine Erklärung.');
    state.followupMessages.push({role:'assistant',text:result.answer});
  }catch(e){
    state.quizError=e.message;
  }
  state.loadingFollowup=false;
  render();
}

function nextQuestion() {
  generateQuestion();
}

}

/* HAUPTANZEIGE */

function render() {

  const app =
    document.getElementById('app');

  try {

    const correctCount =
      state.history.filter(
        h => h.verdict === 'richtig'
      ).length;


    let html = `
    <header>

      <h1>
        Wissens<span>kartei</span>
      </h1>

      <nav>

        <button
          data-nav="library"
          class="${state.view === 'library' ? 'active' : ''}">
          Bibliothek
        </button>

        <button
          data-nav="quiz"
          class="${state.view === 'quiz' ? 'active' : ''}">
          Quiz
        </button>

        <button data-nav="errors" class="${state.view === 'errors' ? 'active' : ''}">Fehler</button>

        <button
          data-nav="settings"
          class="${state.view === 'settings' ? 'active' : ''}">
          ⚙
        </button>

      </nav>

    </header>`;


    if (
      state.view !== 'settings' &&
      state.history.length > 0
    ) {

      html += `
      <div class="stat-line">

        <b>${correctCount}</b>
        von
        <b>${state.history.length}</b>
        bisher richtig beantwortet

      </div>`;
    }


    if (state.view === 'library') {

      html += renderLibrary();

    }

    else if (state.view === 'quiz') { html += renderQuiz(); }
    else if (state.view === 'errors') { html += renderErrors(); }
    else {

      html += renderSettings();

    }


    app.innerHTML = html;

    attachHandlers();

    if (state.view === 'settings') {
      attachSettingsHandlers();
    }

  }

  catch (e) {

    console.error(
      'Render-Fehler:',
      e
    );

    app.innerHTML = `
      <div class="center-block">

        Etwas ist beim Anzeigen
        schiefgelaufen:

        ${esc(e.message)}

      </div>`;
  }
}

/* QUIZ ANZEIGEN */

function renderQuiz() {

  if (state.sources.length === 0) {

    return `
      <div class="center-block">

        Lege zuerst in der
        Bibliothek eine Quelle an.

      </div>`;
  }


  const errorBlock =
    state.quizError

    ? `
      <div class="feedback wrong">

        <strong>Fehler:</strong>

        ${esc(state.quizError)}

      </div>
      `

    : '';


  if (
    !state.currentQuestion &&
    !state.loadingQuestion
  ) {

    return `

      <div class="center-block">

        ${errorBlock}

        <div style="margin-bottom:8px">Wähle auf Wunsch ein Thema:</div>
        <div class="topic-filter">
          <button class="topic-chip ${state.selectedTopics.length===0?'active':''}" data-topic="__all">Alle</button>
          ${topics().map(t=>`<button class="topic-chip ${state.selectedTopics.includes(t)?'active':''}" data-topic="${esc(t)}">${esc(t)}</button>`).join('')}
        </div>
        <div class="row" style="justify-content:center;margin-top:18px">
          <button class="btn" id="start-quiz">Frage stellen</button>
        </div>

      </div>`;
  }


  if (state.loadingQuestion) {

    return `

      <div class="center-block">

        <span class="loading"></span>

        Frage wird vorbereitet …

      </div>`;
  }


  const q =
    state.currentQuestion;


  let html = `

    <div class="quiz-wrap">

      <div class="card-stack">

        <div class="index-card">

          <div class="tab">
            Kartei
          </div>

          <div class="topic">
            ${esc(q.topic || '')}
          </div>

          <div class="question">
            ${esc(q.question)}
          </div>
  `;


  if (!state.feedback) {

    html += errorBlock;

    html += `

      <textarea
        id="answer-text"
        placeholder="Deine Antwort …">${esc(state.answerText)}</textarea>

      <div class="row">

        <button
          class="btn"
          id="submit-answer"
          ${!state.answerText.trim() ? 'disabled' : ''}>

          Antwort abschicken

        </button>
        <button class="btn secondary" id="dont-know">Weiß ich nicht</button>

      </div>
    `;
  }


  else {

    const v =
      state.feedback.verdict;

    const cls =
      v === 'richtig'
        ? 'correct'
        :
      v === 'falsch'
        ? 'wrong'
        :
        'partial';


    html += `

      <div class="feedback ${cls}">

        <strong>
          ${esc(v)}
        </strong>

        <div class="feedback-label">Bewertung</div>
        <div>${esc(state.feedback.feedback || '')}</div>
        ${state.feedback.missing ? `<div class="feedback-label">Das fehlte noch</div><div>${esc(state.feedback.missing)}</div>` : ''}
        <div class="feedback-label">Musterantwort</div>
        <div class="answer">${esc(state.feedback.correctAnswer || '')}</div>

      </div>

      <div class="row">
        <button class="btn secondary" id="open-followup">
          💬 Mehr dazu / Nachfragen
        </button>
      </div>

      ${state.followupOpen ? `
        <div style="margin-top:14px">
          ${state.followupMessages.map(m=>`
            <div style="margin:8px 0;padding:10px 12px;border-radius:8px;${m.role==='user'?'background:rgba(43,36,23,.08)':'background:rgba(192,154,78,.12)'}">
              <div class="feedback-label">${m.role==='user'?'Deine Frage':'Erklärung'}</div>
              <div>${esc(m.text)}</div>
            </div>`).join('')}
          ${state.loadingFollowup ? `<div style="margin:10px 0"><span class="loading"></span> Erklärung wird vorbereitet …</div>` : `
            <textarea id="followup-input" placeholder="Was möchtest du dazu noch wissen?">${esc(state.followupText)}</textarea>
            <div class="row">
              <button class="btn secondary" id="send-followup" ${!state.followupText.trim()?'disabled':''}>Nachfragen</button>
            </div>
          `}
        </div>
      ` : ''}

      <div class="row">

        <button
          class="btn"
          id="next-question">

          Nächste Frage

        </button>

      </div>
    `;
  }


  html += `

        </div>

      </div>

    </div>
  `;


  return html;
}



/* FEHLERLISTE */
function renderErrors(){
  const bad=state.sources.filter(s=>{const v=latestVerdict(s.id);return v==='falsch'||v==='teilweise';});
  if(!bad.length) return `<div class="center-block">Noch keine unsicheren oder falschen Karten.</div>`;
  return `<div class="add-box"><h2>Meine Fehler</h2><div class="hint">${bad.length} Karten zum Wiederholen</div><div class="row"><button class="btn" id="start-error-quiz">Fehler-Quiz starten</button></div></div>`+
    bad.map(s=>`<div class="error-card"><strong>${esc(s.title)}</strong><div class="hint">${esc(sourceTopic(s))} · zuletzt ${esc(latestVerdict(s.id))}</div></div>`).join('');
}

  if(sendFollowupBtn) sendFollowupBtn.onclick=askFollowup;

    else state.selectedTopics.push(t);

  const dk=document.getElementById('dont-know'); if(dk) dk.onclick=dontKnow;
  const eq=document.getElementById('start-error-quiz'); if(eq) eq.onclick=()=>{state.errorOnly=true;state.view='quiz';state.currentQuestion=null;render();};
  const start=document.getElementById('start-quiz'); if(start){ const old=start.onclick; start.onclick=()=>{ if(state.view==='quiz' && !state.errorOnly) state.errorOnly=false; generateQuestion(); }; }
}
