<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wissenskartei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg: #14171f;
    --panel: #1c2029;
    --panel-line: #2a2f3d;
    --ink-muted: #8b92a6;
    --ink-light: #e7e5df;
    --card: #ece2c9;
    --card-shadow1: #d9cdac;
    --card-shadow2: #c6b98f;
    --ink-on-card: #2b2417;
    --ink-on-card-muted: #6b5f45;
    --brass: #c09a4e;
    --good: #6b8f71;
    --bad: #b15c4a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image: radial-gradient(circle at 15% 0%, #1a1e29 0%, var(--bg) 55%);
    color:var(--ink-light);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .shell{max-width:640px;margin:0 auto;padding:28px 20px 60px;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0;
    letter-spacing:0.2px;
  }
  h1 span{color:var(--brass);font-style:italic;font-weight:500;}
  nav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;padding:3px;}
  nav button{
    background:transparent;border:none;color:var(--ink-muted);
    font-family:'IBM Plex Sans';font-size:0.85rem;font-weight:500;
    padding:7px 14px;border-radius:6px;cursor:pointer;transition:background .15s, color .15s;
  }
  nav button.active{background:var(--panel-line);color:var(--ink-light);}
  .stat-line{font-size:0.82rem;color:var(--ink-muted);margin-bottom:22px;}
  .stat-line b{color:var(--brass);font-weight:600;}

  /* library */
  .add-box{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:16px;margin-bottom:22px;}
  .add-box h2{font-family:'Fraunces';font-weight:500;font-size:1.05rem;margin:0 0 12px;}
  .add-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .add-tabs button{
    flex:1;background:var(--bg);border:1px solid var(--panel-line);color:var(--ink-muted);
    padding:8px;border-radius:7px;font-size:0.8rem;cursor:pointer;font-family:'IBM Plex Sans';
  }
  .add-tabs button.active{border-color:var(--brass);color:var(--ink-light);}
  input[type=text], textarea{
    width:100%;background:var(--bg);border:1px solid var(--panel-line);border-radius:7px;
    color:var(--ink-light);padding:9px 11px;font-family:'IBM Plex Sans';font-size:0.9rem;resize:vertical;
  }
  textarea{min-height:90px;}
  label.field{display:block;font-size:0.75rem;color:var(--ink-muted);margin:10px 0 5px;}
  .row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .btn{
    background:var(--brass);color:#1c1608;border:none;border-radius:7px;padding:9px 16px;
    font-family:'IBM Plex Sans';font-weight:600;font-size:0.85rem;cursor:pointer;
  }
  .btn:disabled{opacity:0.45;cursor:default;}
  .btn.ghost{background:transparent;border:1px solid var(--panel-line);color:var(--ink-light);}
  .btn.mic{background:var(--panel-line);color:var(--ink-light);border-radius:50%;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .btn.mic.recording{background:var(--bad);}
  .hint{font-size:0.75rem;color:var(--ink-muted);margin-top:6px;}

  .source-card{
    background:var(--panel);border:1px solid var(--panel-line);border-radius:9px;
    padding:12px 14px;margin-bottom:9px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
  }
  .source-card .meta{font-family:'Fraunces';font-size:0.98rem;color:var(--ink-light);}
  .source-card .snippet{font-size:0.78rem;color:var(--ink-muted);margin-top:3px;line-height:1.4;}
  .source-card button{background:none;border:none;color:var(--ink-muted);cursor:pointer;font-size:0.75rem;flex-shrink:0;}
  .source-card button:hover{color:var(--bad);}
  .empty{color:var(--ink-muted);font-size:0.88rem;padding:20px 4px;text-align:center;}

  /* quiz */
  .quiz-wrap{display:flex;justify-content:center;padding-top:10px;}
  .card-stack{position:relative;width:100%;max-width:420px;}
  .card-stack::before, .card-stack::after{
    content:"";position:absolute;inset:0;border-radius:4px;
  }
  .card-stack::before{background:var(--card-shadow1);transform:rotate(-2.2deg) translateY(3px);}
  .card-stack::after{background:var(--card-shadow2);transform:rotate(2.4deg) translateY(5px);}
  .index-card{
    position:relative;z-index:1;background:var(--card);color:var(--ink-on-card);
    border-radius:4px;padding:26px 24px 22px;min-height:230px;
    box-shadow:0 14px 28px rgba(0,0,0,0.35);
    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(107,95,69,0.13) 28px);
  }
  .index-card .tab{
    position:absolute;top:-14px;left:24px;background:var(--card);
    padding:4px 12px 3px;border-radius:4px 4px 0 0;font-size:0.68rem;
    letter-spacing:0.06em;color:var(--ink-on-card-muted);font-weight:600;
  }
  .index-card .topic{font-size:0.72rem;color:var(--ink-on-card-muted);margin-bottom:10px;font-style:italic;font-family:'Fraunces';}
  .index-card .question{font-family:'Fraunces';font-weight:500;font-size:1.28rem;line-height:1.4;margin-bottom:18px;}
  .index-card textarea{background:rgba(255,255,255,0.45);border:1px solid rgba(107,95,69,0.3);color:var(--ink-on-card);min-height:70px;}
  .index-card .row{margin-top:14px;}
  .index-card .btn.mic{background:rgba(107,95,69,0.15);color:var(--ink-on-card);}
  .index-card .btn.mic.recording{background:var(--bad);color:#fff;}

  .feedback{margin-top:18px;padding:14px 16px;border-radius:8px;font-size:0.88rem;line-height:1.5;}
  .feedback.correct{background:rgba(107,143,113,0.15);border:1px solid var(--good);}
  .feedback.wrong{background:rgba(177,92,74,0.15);border:1px solid var(--bad);}
  .feedback.partial{background:rgba(192,154,78,0.15);border:1px solid var(--brass);}
  .feedback .verdict{font-weight:600;margin-bottom:6px;font-family:'Fraunces';}
  .feedback .verdict.correct{color:var(--good);}
  .feedback .verdict.wrong{color:var(--bad);}
  .feedback .verdict.partial{color:var(--brass);}
  .feedback .answer{margin-top:8px;color:var(--ink-muted);font-size:0.82rem;}

  .center-block{text-align:center;padding:50px 20px;color:var(--ink-muted);}
  .center-block .btn{margin-top:14px;}
  .loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.25);border-top-color:var(--brass);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-2px;margin-right:7px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="shell" id="app"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const state = {
  view: 'library',
  addMode: 'text',
  sources: [],
  history: [],
  currentQuestion: null,
  feedback: null,
  loadingQuestion: false,
  loadingGrading: false,
  loadingPdf: false,
  recording: false,
  recognitionTarget: null,
  draftTitle: '',
  draftText: '',
  answerText: '',
  recentlyAskedIds: [],
  settingsView: false,
  settings: { provider: 'anthropic', anthropicKey: '', deepseekKey: '', deepseekProxyUrl: '' }
};

function loadSettings() {
  try {
    const raw = localStorage.getItem('wissenskartei_settings');
    if (raw) state.settings = { ...state.settings, ...JSON.parse(raw) };
  } catch (e) { /* keine gespeicherten Einstellungen */ }
}
function saveSettings() {
  try { localStorage.setItem('wissenskartei_settings', JSON.stringify(state.settings)); } catch (e) {}
}

function loadStorage() {
  try {
    const s = localStorage.getItem('wissenskartei_sources');
    if (s) state.sources = JSON.parse(s);
  } catch (e) { /* noch keine Quellen gespeichert */ }
  try {
    const h = localStorage.getItem('wissenskartei_history');
    if (h) state.history = JSON.parse(h);
  } catch (e) { /* noch keine Historie gespeichert */ }
  loadSettings();
  render();
}

function saveSources() {
  try { localStorage.setItem('wissenskartei_sources', JSON.stringify(state.sources)); } catch (e) { console.error('Speichern fehlgeschlagen:', e); }
}
function saveHistory() {
  try { localStorage.setItem('wissenskartei_history', JSON.stringify(state.history)); } catch (e) { console.error('Speichern fehlgeschlagen:', e); }
}

function importPreset() {
  const existing = new Set(state.sources.map(s => s.title));
  const toAdd = PRESET_WELTGESCHICHTE.filter(p => !existing.has(p.title));
  toAdd.forEach((p, i) => {
    state.sources.push({ id: (Date.now() + i).toString(), title: p.title, text: p.text, addedAt: new Date().toISOString() });
  });
  saveSources();
  render();
}

let recognition = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = 'de-DE';
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    let finalText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
    }
    if (!finalText) return;
    if (state.recognitionTarget === 'draft') {
      state.draftText = (state.draftText ? state.draftText + ' ' : '') + finalText.trim();
    } else if (state.recognitionTarget === 'answer') {
      state.answerText = (state.answerText ? state.answerText + ' ' : '') + finalText.trim();
    }
    render();
  };
  recognition.onend = () => { state.recording = false; state.recognitionTarget = null; render(); };
}

function toggleRecording(target) {
  if (!recognition) return;
  if (state.recording && state.recognitionTarget === target) {
    recognition.stop();
    return;
  }
  if (state.recording) recognition.stop();
  state.recognitionTarget = target;
  state.recording = true;
  render();
  try { recognition.start(); } catch (e) { /* already started */ }
}

function extractJson(text) {
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if (start === -1 || end === -1 || end < start) {
    throw new Error('Keine JSON-Antwort gefunden: ' + text.slice(0, 200));
  }
  return JSON.parse(text.slice(start, end + 1));
}

async function callClaude(prompt) {
  const provider = state.settings.provider;
  if (provider === 'anthropic') {
    if (!state.settings.anthropicKey) throw new Error('Bitte zuerst einen Anthropic-API-Key in den Einstellungen eintragen.');
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": state.settings.anthropicKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!response.ok) {
      const errText = await response.text().catch(() => '');
      throw new Error('Anthropic-API-Fehler ' + response.status + ': ' + errText.slice(0, 200));
    }
    const data = await response.json();
    const text = (data.content || []).map(b => b.text || '').join('\n');
    return extractJson(text);
  } else {
    if (!state.settings.deepseekKey) throw new Error('Bitte zuerst einen DeepSeek-API-Key in den Einstellungen eintragen.');
    const url = state.settings.deepseekProxyUrl.trim() || "https://api.deepseek.com/chat/completions";
    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + state.settings.deepseekKey
      },
      body: JSON.stringify({
        model: "deepseek-chat",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!response.ok) {
      const errText = await response.text().catch(() => '');
      throw new Error('DeepSeek-API-Fehler ' + response.status + ': ' + errText.slice(0, 200));
    }
    const data = await response.json();
    const text = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
    return extractJson(text);
  }
}

function combinedSourceText() {
  const shuffled = [...state.sources].sort(() => Math.random() - 0.5);
  let combined = shuffled.map(s => `### ${s.title}\n${s.text}`).join('\n\n');
  if (combined.length > 9000) combined = combined.slice(0, 9000);
  return combined;
}

async function addPdf(file) {
  state.loadingPdf = true; render();
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    state.draftText = text.trim();
    if (!state.draftTitle) state.draftTitle = file.name.replace(/\.pdf$/i, '');
  } catch (e) {
    alert('PDF konnte nicht gelesen werden: ' + e.message);
  }
  state.loadingPdf = false; render();
}

function saveDraftSource() {
  if (!state.draftText.trim()) return;
  state.sources.push({
    id: Date.now().toString(),
    title: state.draftTitle.trim() || 'Ohne Titel',
    text: state.draftText.trim(),
    addedAt: new Date().toISOString()
  });
  state.draftTitle = '';
  state.draftText = '';
  saveSources();
  render();
}

function deleteSource(id) {
  state.sources = state.sources.filter(s => s.id !== id);
  saveSources();
  render();
}

async function generateQuestion() {
  if (state.sources.length === 0) return;
  state.loadingQuestion = true;
  state.currentQuestion = null;
  state.feedback = null;
  state.answerText = '';
  state.quizError = null;
  render();
  try {
    let pool = state.sources.filter(s => !state.recentlyAskedIds.includes(s.id));
    if (pool.length === 0) {
      state.recentlyAskedIds = [];
      pool = state.sources;
    }
    const source = pool[Math.floor(Math.random() * pool.length)];
    const prompt = `Du bist ein Geschichts-Quizmaster. Hier ist eine einzelne Karteikarte aus der Sammlung des Nutzers:\n\nTitel: ${source.title}\nInhalt: ${source.text}\n\nStelle EINE konkrete, offene Wissensfrage auf Deutsch genau zu diesem Inhalt (nicht zu anderen Themen). Die Frage soll offen sein (keine Multiple-Choice), sodass man in eigenen Worten antworten muss. Antworte NUR mit einem JSON-Objekt, kein weiterer Text, kein Markdown:\n{"question": "...", "topic": "kurzes Stichwort, z.B. Name oder Epoche"}`;
    const result = await callClaude(prompt);
    if (!result.question) throw new Error('Antwort enthielt keine Frage.');
    result.sourceId = source.id;
    state.currentQuestion = result;
    state.recentlyAskedIds.push(source.id);
    const keepLimit = Math.max(1, Math.floor(state.sources.length * 0.8));
    if (state.recentlyAskedIds.length > keepLimit) state.recentlyAskedIds.shift();
  } catch (e) {
    state.quizError = e.message;
  }
  state.loadingQuestion = false;
  render();
}

async function submitAnswer() {
  if (!state.answerText.trim() || !state.currentQuestion) return;
  state.loadingGrading = true;
  state.quizError = null;
  render();
  try {
    const source = state.sources.find(s => s.id === state.currentQuestion.sourceId);
    const context = source ? `Titel: ${source.title}\nInhalt: ${source.text}` : combinedSourceText();
    const prompt = `Du bist ein Geschichts-Quizmaster und bewertest eine Antwort.\n\nKarteikarte:\n${context}\n\nFrage: ${state.currentQuestion.question}\nAntwort des Nutzers: ${state.answerText.trim()}\n\nBewerte, ob die Antwort inhaltlich korrekt ist -- es muss nicht wortwörtlich stimmen, der Kern muss stimmen. Wenn Teile fehlen oder ungenau sind, ist es "teilweise". Gib kurzes, konkretes Feedback auf Deutsch und ergänze fehlende oder falsche Fakten. Antworte NUR mit einem JSON-Objekt, kein weiterer Text, kein Markdown:\n{"verdict": "richtig" | "teilweise" | "falsch", "feedback": "...", "correctAnswer": "die vollständige, korrekte Antwort in 1-2 Sätzen"}`;
    const result = await callClaude(prompt);
    if (!result.verdict) throw new Error('Antwort enthielt keine Bewertung.');
    state.feedback = result;
    state.history.push({
      question: state.currentQuestion.question,
      answer: state.answerText.trim(),
      verdict: result.verdict,
      date: new Date().toISOString()
    });
    saveHistory();
  } catch (e) {
    state.quizError = e.message;
  }
  state.loadingGrading = false;
  render();
}

function nextQuestion() { generateQuestion(); }

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function attachSettingsHandlers() {
  document.querySelectorAll('[data-provider]').forEach(b => b.onclick = () => { state.settings.provider = b.dataset.provider; render(); });
  const saveBtn = document.getElementById('save-settings');
  if (saveBtn) saveBtn.onclick = () => {
    const ak = document.getElementById('anthropic-key');
    const dk = document.getElementById('deepseek-key');
    const dp = document.getElementById('deepseek-proxy');
    if (ak) state.settings.anthropicKey = ak.value.trim();
    if (dk) state.settings.deepseekKey = dk.value.trim();
    if (dp) state.settings.deepseekProxyUrl = dp.value.trim();
    saveSettings();
    render();
  };
}

function render() {
  const app = document.getElementById('app');
  try {
    const correctCount = state.history.filter(h => h.verdict === 'richtig').length;

    let html = `<header>
      <h1>Wissens<span>kartei</span></h1>
      <nav>
        <button data-nav="library" class="${state.view === 'library' ? 'active' : ''}">Bibliothek</button>
        <button data-nav="quiz" class="${state.view === 'quiz' ? 'active' : ''}">Quiz</button>
        <button data-nav="settings" class="${state.view === 'settings' ? 'active' : ''}">⚙</button>
      </nav>
    </header>`;

    if (state.view !== 'settings' && state.history.length > 0) {
      html += `<div class="stat-line"><b>${correctCount}</b> von <b>${state.history.length}</b> bisher richtig beantwortet</div>`;
    }

    if (state.view === 'library') html += renderLibrary();
    else if (state.view === 'quiz') html += renderQuiz();
    else html += renderSettings();

    app.innerHTML = html;
    attachHandlers();
    if (state.view === 'settings') attachSettingsHandlers();
  } catch (e) {
    console.error('Render-Fehler:', e);
    app.innerHTML = `<div class="center-block">Etwas ist beim Anzeigen schiefgelaufen: ${esc(e.message)}<div><button class="btn" onclick="location.reload()">Neu laden</button></div></div>`;
  }
}

    </div>
  </div>`;

  const presetNew = PRESET_WELTGESCHICHTE.filter(p => !state.sources.some(s => s.title === p.title)).length;
  if (presetNew > 0) {
    html += `<div class="add-box" style="border-color:var(--brass);">
      <h2>Roter Faden der Weltgeschichte</h2>
      <div class="hint" style="margin-bottom:10px;">${presetNew} Karten aus deinem PDF bereit zum Import – eine je Datum/Ereignis.</div>
      <button class="btn" id="import-preset">Alle importieren</button>
    </div>`;
  }

  if (state.sources.length === 0) {
    html += `<div class="empty">Noch keine Quellen in der Kartei. Füge oben Text, ein PDF oder eine Spracheingabe hinzu.</div>`;
  } else {
    html += state.sources.map(s => `
      <div class="source-card">
        <div>
          <div class="meta">${esc(s.title)}</div>
          <div class="snippet">${esc(s.text.slice(0, 140))}${s.text.length > 140 ? '…' : ''}</div>
        </div>
        <button data-delete="${s.id}">Entfernen</button>
      </div>`).join('');
  }
  return html;
}

function renderQuiz() {
  if (state.sources.length === 0) {
    return `<div class="center-block">Lege zuerst in der Bibliothek eine Quelle an – dann kann ich dir Fragen dazu stellen.</div>`;
  }

  const errorBlock = state.quizError
    ? `<div class="feedback wrong"><div class="verdict wrong">Fehler</div><div>${esc(state.quizError)}</div></div>`
    : '';

  if (!state.currentQuestion && !state.loadingQuestion) {
    return `<div class="center-block">${errorBlock}Bereit für eine neue Frage aus deiner Kartei?
      <div><button class="btn" id="start-quiz">Frage stellen</button></div>
    </div>`;
  }

  if (state.loadingQuestion) {
    return `<div class="center-block"><span class="loading"></span>Frage wird vorbereitet …</div>`;
  }

  const q = state.currentQuestion;
  let html = `<div class="quiz-wrap"><div class="card-stack"><div class="index-card">
    <div class="tab">Kartei</div>
    <div class="topic">${esc(q.topic || '')}</div>
    <div class="question">${esc(q.question)}</div>`;

  if (!state.feedback) {
    html += errorBlock;
    html += `<div class="row" style="align-items:flex-start;">
      <textarea id="answer-text" placeholder="Deine Antwort …">${esc(state.answerText)}</textarea>
      ${recognition ? `<button class="btn mic ${state.recording && state.recognitionTarget === 'answer' ? 'recording' : ''}" data-mic="answer" title="Antworten per Sprache">🎙</button>` : ''}
    </div>
    <div class="row">
      <button class="btn" id="submit-answer" ${!state.answerText.trim() || state.loadingGrading ? 'disabled' : ''}>${state.loadingGrading ? '<span class="loading"></span>Wird geprüft …' : 'Antwort abschicken'}</button>
    </div>`;
  } else {
    const v = state.feedback.verdict;
    const cls = v === 'richtig' ? 'correct' : (v === 'falsch' ? 'wrong' : 'partial');
    const label = v === 'richtig' ? 'Richtig' : (v === 'falsch' ? 'Nicht ganz' : 'Teilweise richtig');
    html += `<div class="feedback ${cls}">
      <div class="verdict ${cls}">${label}</div>
      <div>${esc(state.feedback.feedback)}</div>
      <div class="answer">${esc(state.feedback.correctAnswer)}</div>
    </div>
    <div class="row"><button class="btn" id="next-question">Nächste Frage</button></div>`;
  }

  html += `</div></div></div>`;
  return html;
}

function attachHandlers() {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { state.view = b.dataset.nav; render(); });
  document.querySelectorAll('[data-addmode]').forEach(b => b.onclick = () => { state.addMode = b.dataset.addmode; render(); });

  const titleInput = document.getElementById('draft-title');
  if (titleInput) titleInput.oninput = (e) => { state.draftTitle = e.target.value; };

  const textArea = document.getElementById('draft-text');
  if (textArea) textArea.oninput = (e) => { state.draftText = e.target.value; };

  const pdfInput = document.getElementById('pdf-input');
  if (pdfInput) pdfInput.onchange = (e) => { if (e.target.files[0]) addPdf(e.target.files[0]); };

  const saveBtn = document.getElementById('save-source');
  if (saveBtn) saveBtn.onclick = saveDraftSource;

  const importBtn = document.getElementById('import-preset');
  if (importBtn) importBtn.onclick = importPreset;

  document.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteSource(b.dataset.delete));

  document.querySelectorAll('[data-mic]').forEach(b => b.onclick = () => toggleRecording(b.dataset.mic));

  const startBtn = document.getElementById('start-quiz');
  if (startBtn) startBtn.onclick = generateQuestion;

  const answerArea = document.getElementById('answer-text');
  if (answerArea) answerArea.oninput = (e) => { state.answerText = e.target.value; document.getElementById('submit-answer').disabled = !e.target.value.trim(); };

  const submitBtn = document.getElementById('submit-answer');
  if (submitBtn) submitBtn.onclick = submitAnswer;

  const nextBtn = document.getElementById('next-question');
  if (nextBtn) nextBtn.onclick = nextQuestion;
}

loadStorage();
</script>
</body>
</html>
